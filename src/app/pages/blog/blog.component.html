<div class="blog-background">
    <div class="blog-page">
        <h2>Blog Posts</h2>

        <section class="posts-list">
            <p class="no-posts" *ngIf="hasNoPosts$ | async">No blog posts yet. Check back soon!</p>

            <article class="post-card" *ngFor="let post of posts$ | async">
                <p class="post-date">{{ post.created_at | date: 'mediumDate' }}</p>
                <h3 class="post-title">{{ post.title }}</h3>
                <p class="post-excerpt">{{ excerpt(post.content) }}</p>
                <button class="read-more" type="button" [routerLink]="['/blog', post.slug]">Read More</button>
            </article>
            <div
                *ngIf="(isTotalCountReached$ | async) === false"
                class="btn-container"
            >
                <button class="load-more-btn" type="button" (click)="loadMore()">Load More Posts</button>
            </div>
        </section>

    </div>
</div>
