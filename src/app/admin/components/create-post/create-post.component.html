<div class="create-post">
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" [(ngModel)]="title" />
    </div>

    <div class="form-group">
        <label>Content</label>
        <quill-editor [(ngModel)]="content"></quill-editor>
    </div>

    <div class="form-actions">
        <button type="button" class="draft-btn">Save as Draft</button>
        <button type="button" class="save-btn">Post Now</button>
    </div>
</div>
