<div class="create-post">
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" [(ngModel)]="title" />
    </div>

    <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category" [(ngModel)]="category_id" [compareWith]="compareCategoryIds">
            <option [ngValue]="null">No category</option>
            <option *ngFor="let category of categories$ | async" [ngValue]="category.id">
                {{ category.name }}
            </option>
        </select>
    </div>

    <div class="form-group">
        <label>Content</label>
        <quill-editor
            [(ngModel)]="content"
            [modules]="quillModules"
            (onEditorCreated)="onEditorCreated($event)"
        ></quill-editor>
    </div>

    <div class="form-actions">
        <button type="button" class="draft-btn" (click)="saveDraft()">Save as Draft</button>
        <button type="button" class="save-btn" (click)="postNow()">Post Now</button>
    </div>
</div>
